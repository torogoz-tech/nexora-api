schema_version: 2
max_nesting: 128
max_steps: 1000000
groups:
- open: (
  close: )
  kind: delimiter
- open: '{'
  close: '}'
  kind: delimiter
- open: '['
  close: ']'
  kind: delimiter
ignored:
- type: literal
  text: ;
opaque_references:
- text: import
  kind: keyword
- text: require
  kind: identifier
- text: export
  kind: keyword
recovery:
- text: ;
  kind: delimiter
recover_line_break: true
rules:
  named_binding:
    type: sequence
    items:
    - type: token
      kind: identifier
    - type: optional
      item:
        type: sequence
        items:
        - type: literal
          text: as
        - type: token
          kind: identifier
  named:
    type: sequence
    items:
    - type: literal
      text: '{'
    - type: optional
      item:
        type: sequence
        items:
        - type: rule
          name: named_binding
        - type: repeat
          item:
            type: sequence
            items:
            - type: literal
              text: ','
            - type: rule
              name: named_binding
          min: 0
          max: 128
        - type: optional
          item:
            type: literal
            text: ','
    - type: literal
      text: '}'
  namespace:
    type: sequence
    items:
    - type: literal
      text: '*'
    - type: literal
      text: as
    - type: token
      kind: identifier
  bindings:
    type: choice
    alternatives:
    - type: sequence
      items:
      - type: token
        kind: identifier
      - type: optional
        item:
          type: sequence
          items:
          - type: literal
            text: ','
          - type: choice
            alternatives:
            - type: rule
              name: namespace
            - type: rule
              name: named
    - type: rule
      name: namespace
    - type: rule
      name: named
  module_source:
    type: choice
    alternatives:
    - type: capture
      name: source
      item:
        type: token
        kind: string
      join: ''
    - type: sequence
      items:
      - type: rule
        name: bindings
      - type: literal
        text: from
      - type: capture
        name: source
        item:
          type: token
          kind: string
        join: ''
productions:
- name: function_declaration
  pattern:
    type: sequence
    items:
    - type: literal
      text: function
      kind: keyword
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: balanced
      open: (
    - type: balanced
      open: '{'
  projection:
    ast_kind: function
    role: Declaration
    name_capture: name
- name: class_declaration
  pattern:
    type: sequence
    items:
    - type: literal
      text: class
      kind: keyword
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: balanced
      open: '{'
  projection:
    ast_kind: class
    role: Declaration
    name_capture: name
- name: static_module_import
  pattern:
    type: sequence
    items:
    - type: literal
      text: import
      kind: keyword
    - type: rule
      name: module_source
    - type: choice
      alternatives:
      - type: literal
        text: ;
      - type: line_end
  projection:
    ast_kind: module_import
    role: Reference
    name_capture: source
- name: default_symbol_export
  pattern:
    type: sequence
    items:
    - type: literal
      text: export
      kind: keyword
    - type: literal
      text: default
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: choice
      alternatives:
      - type: literal
        text: ;
      - type: line_end
  projection:
    ast_kind: symbol_export_default
    role: Reference
    name_capture: name
- name: named_symbol_export
  pattern:
    type: sequence
    items:
    - type: literal
      text: export
      kind: keyword
    - type: literal
      text: '{'
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: literal
      text: '}'
    - type: choice
      alternatives:
      - type: literal
        text: ;
      - type: line_end
  projection:
    ast_kind: symbol_export_named
    role: Reference
    name_capture: name
recovery_groups:
- '{'
