[package]
name = "nexora-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nexora-core.workspace = true
nexora-graph.workspace = true
nexora-storage.workspace = true
nexora-indexer.workspace = true
