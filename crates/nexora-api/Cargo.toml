[package]
name = "nexora-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3"
tower-http = { version = "0.7.1", features = ["cors"] }
sha2.workspace = true
base64 = "0.22"
nexora-reasoning = { path = "../nexora-reasoning" }
nexora-platform.workspace = true
nexora-platform-store = { path = "../nexora-platform-store" }
nexora-runtime.workspace = true
nexora-mcp.workspace = true
nexora-core.workspace = true
nexora-indexer.workspace = true
nexora-language.workspace = true
nexora-source.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
axum = "0.8"
# Select ring through the transport crate to avoid Lapin's default AWS-LC native build.
lapin = { version = "4.12.3", default-features = false, features = ["rustls--ring", "tokio"] }
amq-protocol-tcp = { version = "=10.7.0", default-features = false, features = ["rustls-common", "rustls--ring", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

zeroize = "1"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
lettre = { version = "0.11", default-features = false, features = ["builder"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
hmac = "0.12"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
ureq = { version = "3", default-features = false, features = ["json"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
