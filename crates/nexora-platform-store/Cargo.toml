[package]
name = "nexora-platform-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nexora-language.workspace = true
nexora-indexer.workspace = true
nexora-core.workspace = true
nexora-platform = { path = "../nexora-platform" }
nexora-runtime.workspace = true
nexora-reasoning = { path = "../nexora-reasoning" }
nexora-source = { path = "../nexora-source" }
nexora-retrieval.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
postgres = { version = "0.19", features = ["with-serde_json-1"] }
argon2 = { version = "0.6", features = ["getrandom"] }
getrandom = "0.3"
subtle = "2"

hmac = "0.12"
sha1 = "0.10"
zeroize = "1"

aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
hkdf = "0.12.4"

openidconnect = { version = "4.1.0", default-features = false }
ureq = { version = "3", features = ["json"] }
url = "2"

jsonwebtoken = { version = "=11.1.0", features = ["rust_crypto"] }
time = { version = "0.3", features = ["parsing"] }

base64 = "0.22"
passkey-auth = "0.1.3"

email_address = "0.2"

[dev-dependencies]
nexora-core.workspace = true
nexora-indexer.workspace = true
nexora-language.workspace = true
