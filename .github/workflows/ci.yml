name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.100.0 --profile minimal --no-self-update
      - run: rustup component add rustfmt clippy --toolchain 1.100.0
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --lib --bins --locked
      - run: cargo clippy --workspace --lib --bins --locked -- -D warnings
      - run: cargo run -p nexora-cli --locked -- languages validate languages/javascript
      - run: cargo run -p nexora-cli --locked -- analyze tests/fixtures/javascript/declarations.js
      - run: cargo run -p nexora-cli --locked -- policy validate policies/examples
      - run: cargo run -p nexora-cli --locked -- policy test policies/examples
      - run: cargo run -p nexora-cli --locked -- policy validate policies/architecture/domain-boundary
      - run: cargo run -p nexora-cli --locked -- policy test policies/architecture/domain-boundary
      - run: python3 scripts/validation/check-language-neutrality.py
      - run: cargo run -p nexora-cli --locked -- languages validate languages/lua
      - run: cargo run -p nexora-cli --locked -- languages validate templates/language-pack
      - run: cargo run -p nexora-cli --locked -- policy test policies/architecture/language-neutral-boundary
      - run: cargo run -p nexora-cli --locked -- corpus validate corpus/suite.yaml
      - run: cargo run -p nexora-cli --locked -- corpus check corpus/suite.yaml
      - run: python3 scripts/benchmarks/test_benchmark_corpus.py
      - run: cargo run -p nexora-cli --locked -- index-session corpus/fixtures/lua/allowed --language lua --passes 3
      - run: cargo run -p nexora-cli --locked -- languages validate templates/semantic-molds/brace_mold
      - run: cargo run -p nexora-cli --locked -- languages validate templates/semantic-molds/keyword_mold
      - run: cargo run -p nexora-cli --locked -- languages validate templates/semantic-bindings/brace_bindings
      - run: cargo run -p nexora-cli --locked -- languages validate templates/semantic-bindings/keyword_bindings
      - run: cargo run -p nexora-cli --locked -- languages validate languages/typescript
      - run: cargo run -p nexora-cli --locked -- languages validate languages/tsx
      - run: cargo run -p nexora-cli --locked -- languages validate languages/jsx
      - run: cargo run -p nexora-cli --locked -- languages validate languages/html
      - run: cargo run -p nexora-cli --locked -- languages validate languages/css
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.100.0 --profile minimal --no-self-update
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo test --workspace --tests --locked
  build-artifact:
    needs: [quality, integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.100.0 --profile minimal --no-self-update
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo build --release --locked -p nexora-api
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: nexora-api-0.2.1
          path: target/release/nexora-api
          if-no-files-found: error
          retention-days: 7
  image:
    needs: [quality, build-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nexora-api-0.2.1
          path: image-context
      - run: chmod +x image-context/nexora-api
      - name: Build runtime image
        run: docker build --build-context api-artifact=image-context --tag nexora-api:ci .
      - name: Smoke-test runtime and Git
        run: |
          docker run --rm nexora-api:ci --help > /tmp/nexora-help.txt 2> /tmp/nexora-runtime-errors.txt
          grep -q 'Nexora self-hosted platform API' /tmp/nexora-help.txt
          test ! -s /tmp/nexora-runtime-errors.txt || { cat /tmp/nexora-runtime-errors.txt >&2; exit 1; }
          docker run --rm --entrypoint /bin/sh nexora-api:ci -ec '
            test "$(id -u)" -ne 0
            test -w /var/lib/nexora
            git --version
            test -x "$(git --exec-path)/git-remote-https"
          '
      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          test -n "$GHCR_TOKEN" || { echo "GHCR_TOKEN is not configured" >&2; exit 1; }
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker tag nexora-api:ci "ghcr.io/${GITHUB_REPOSITORY}:0.2.1"
          docker push "ghcr.io/${GITHUB_REPOSITORY}:0.2.1"
