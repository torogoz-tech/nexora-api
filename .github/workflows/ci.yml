name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.100.0 --profile minimal --no-self-update
      - run: rustup component add rustfmt clippy --toolchain 1.100.0
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run -p nexora-cli --locked -- languages validate languages/javascript
      - run: cargo run -p nexora-cli --locked -- analyze tests/fixtures/javascript/declarations.js
      - run: cargo run -p nexora-cli --locked -- policy validate policies/examples
      - run: cargo run -p nexora-cli --locked -- policy test policies/examples
      - run: cargo run -p nexora-cli --locked -- policy validate policies/architecture/domain-boundary
      - run: cargo run -p nexora-cli --locked -- policy test policies/architecture/domain-boundary
      - run: python3 scripts/check-language-neutrality.py
      - run: cargo run -p nexora-cli --locked -- languages validate languages/lua
      - run: cargo run -p nexora-cli --locked -- languages validate templates/language-pack
      - run: cargo run -p nexora-cli --locked -- policy test policies/architecture/language-neutral-boundary
      - run: cargo run -p nexora-cli --locked -- corpus validate corpus/suite.yaml
      - run: cargo run -p nexora-cli --locked -- corpus check corpus/suite.yaml
      - run: python3 -m unittest discover -s scripts -p 'test_benchmark_corpus.py'
      - run: cargo run -p nexora-cli --locked -- index-session corpus/fixtures/lua/allowed --language lua --passes 3
      - run: cargo run -p nexora-cli --locked -- languages validate templates/semantic-molds/brace_mold
      - run: cargo run -p nexora-cli --locked -- languages validate templates/semantic-molds/keyword_mold
      - run: cargo run -p nexora-cli --locked -- languages validate templates/semantic-bindings/brace_bindings
      - run: cargo run -p nexora-cli --locked -- languages validate templates/semantic-bindings/keyword_bindings
      - run: cargo run -p nexora-cli --locked -- languages validate languages/typescript
      - run: cargo run -p nexora-cli --locked -- languages validate languages/tsx
      - run: cargo run -p nexora-cli --locked -- languages validate languages/jsx
      - run: cargo run -p nexora-cli --locked -- languages validate languages/html
      - run: cargo run -p nexora-cli --locked -- languages validate languages/css
