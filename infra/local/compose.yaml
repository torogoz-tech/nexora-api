name: nexora-local

services:
  postgres:
    image: pgvector/pgvector@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    ports:
      - "127.0.0.1:${NEXORA_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks: [knowledge]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly@sha256:061f00b201b58e12f974e4e96c761a881ee1c05e9d8ee967466a604b7299753b
    restart: unless-stopped
    command: ["--flagfile=/run/secrets/dragonfly_flags"]
    ports:
      - "127.0.0.1:${NEXORA_DRAGONFLY_PORT:-16379}:6379"
    volumes:
      - dragonfly_data:/data
    secrets:
      - dragonfly_flags
    networks: [knowledge]
    mem_limit: 384m
    cpus: 0.5
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(sed -n 's/^--requirepass=//p' /run/secrets/dragonfly_flags) redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  neo4j:
    image: neo4j@sha256:249a1ec6e3c52d82101a5ed33d6ed2b5ed5b0017b21a28c0bfebc335e87fb177
    restart: unless-stopped
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
      NEO4J_server_bolt_advertised__address: "${NEXORA_NEO4J_ADVERTISED_HOST:-127.0.0.1}:${NEXORA_NEO4J_BOLT_PORT:-17687}"
      NEO4J_server_http_advertised__address: "${NEXORA_NEO4J_ADVERTISED_HOST:-127.0.0.1}:${NEXORA_NEO4J_HTTP_PORT:-17474}"
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 64m
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      - "127.0.0.1:${NEXORA_NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${NEXORA_NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    secrets:
      - neo4j_auth
    networks: [knowledge]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --timeout=5 http://127.0.0.1:7474/"]
      interval: 15s
      timeout: 6s
      retries: 12
      start_period: 60s
    stop_grace_period: 60s

networks:
  knowledge:
    driver: bridge

volumes:
  postgres_data:
  dragonfly_data:
  neo4j_data:
  neo4j_logs:

secrets:
  postgres_password:
    file: ../../.nexora/local/secrets/postgres_password
  dragonfly_flags:
    file: ../../.nexora/local/secrets/dragonfly_flags
  neo4j_auth:
    file: ../../.nexora/local/secrets/neo4j_auth
