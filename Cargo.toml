[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
regex = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nexora-core = { git = "https://github.com/torogoz-tech/nexora-platform-contracts.git", tag = "0.4.0" }
nexora-platform = { git = "https://github.com/torogoz-tech/nexora-platform-contracts.git", tag = "0.4.0" }
nexora-language = { git = "https://github.com/torogoz-tech/nexora-analysis-engine.git", tag = "0.4.0" }
nexora-graph = { git = "https://github.com/torogoz-tech/nexora-analysis-engine.git", tag = "0.4.0" }
nexora-storage = { git = "https://github.com/torogoz-tech/nexora-analysis-engine.git", tag = "0.4.0" }
nexora-indexer = { git = "https://github.com/torogoz-tech/nexora-analysis-engine.git", tag = "0.4.0" }
nexora-retrieval = { git = "https://github.com/torogoz-tech/nexora-analysis-engine.git", tag = "0.4.0" }
nexora-source = { git = "https://github.com/torogoz-tech/nexora-analysis-engine.git", tag = "0.4.0" }
nexora-mcp = { path = "crates/nexora-mcp" }
nexora-governance = { path = "crates/nexora-governance" }
nexora-corpus = { path = "crates/nexora-corpus" }

nexora-runtime = { git = "https://github.com/torogoz-tech/nexora-job-store.git", rev = "5405bf2571f3c501187a6253fbd6f7a01a4ab3d7" }
