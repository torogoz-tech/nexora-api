- id: lexical.lossless
  description: lexical lossless
- id: syntax.malformed
  description: syntax malformed
- id: lexical.rejected
  description: lexical rejected
- id: dependency.allowed
  description: dependency allowed
- id: dependency.forbidden
  description: dependency forbidden
- id: dependency.external
  description: dependency external
- id: dependency.opaque
  description: dependency opaque
- id: scaling.file
  description: scaling file
- id: scaling.repository
  description: scaling repository
- id: semantic.types
  description: semantic types
- id: real.source
  description: Unmodified pinned public source; partial language support is explicit
- id: symbol.exports
  description: Declared file-scoped symbol links with explicit uncertainty
- id: symbol.qualified
  description: Qualified declaration names and kinds projected from grammar data
- id: semantic.scopes
  description: Structured regions, explicit scope ownership and lexical lookup
- id: semantic.expressions
  description: Structured expression forms with ordered operands and declarative precedence;
    no call or type inference
- id: semantic.calls
  description: Lexical expression bindings and unique direct call targets; explicit
    ambiguity and mutation uncertainty
- id: profile.structure
  description: Initial typed/markup structural extraction with explicitly opaque interiors
- id: composition.boundaries
  description: Nested lexical modes, exact boundaries and explicit opaque/partial
    regions
