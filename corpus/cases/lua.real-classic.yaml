    kind: Method
    name: Object:is
    source: "function Object:is(T)\n  local mt = getmetatable(self)\n  while mt do\n\
      \    if mt == T then\n      return true\n    end\n    mt = getmetatable(mt)\n\
      \  end\n  return false\nend"
