schema_version: 1
identifier_kind: identifier
keywords:
- DEF
- LET
- SCOPE
- USE_LOCAL
- BEGIN
- FINISH
- BECOMES
- VALUE
- ADD
- TIMES
- NEG
- POWER
tokens:
- kind: whitespace
  pattern: \s+
  trivia: true
- kind: comment
  pattern: //[^\r\n]*
  trivia: true
- kind: identifier
  pattern: '[\p{L}_][\p{L}\p{N}_]*'
- kind: number
  pattern: '[0-9]+(?:\.[0-9]+)?'
- kind: string
  pattern: '"(?:[^"\\\r\n]|\\[^\r\n])*"'
- kind: operator
  pattern: \+\+|==|[+*^=.!-]
- kind: delimiter
  pattern: '[(){}\[\],;]'
