        type: token
        kind: identifier
      join: ''
    - type: capture
      name: annotation
      item:
        type: sequence
        items:
        - type: literal
          text: ':'
        - type: scan_until
          stop:
          - text: '='
      join: ''
    - type: literal
      text: '='
    - type: capture
      name: signature
      item:
        type: sequence
        items:
        - type: optional
          item:
            type: sequence
            items:
            - type: literal
              text: async
            - type: gap_without
              characters: "\n\r\L\P"
        - type: choice
          alternatives:
          - type: sequence
            items:
            - type: optional
              item:
                type: sequence
                items:
                - type: literal
                  text: <
                - type: scan_until
                  stop:
                  - text: '>'
                - type: literal
                  text: '>'
            - type: balanced
              open: (
          - type: token
            kind: identifier
        - type: optional
          item:
            type: sequence
            items:
            - type: literal
              text: ':'
            - type: scan_until
              stop:
              - text: =>
        - type: gap_without
          characters: "\n\r\L\P"
        - type: literal
          text: =>
      join: ''
    - type: capture
      name: body
      item:
        type: scan_until
        stop:
        - text: ;
        - text: const
          kind: keyword
        - text: let
          kind: keyword
        - text: var
          kind: keyword
        - text: type
          kind: keyword
        - text: interface
          kind: keyword
        - text: enum
          kind: keyword
        - text: export
          kind: keyword
        - text: function
          kind: keyword
        - text: class
          kind: keyword
        allow_eof: true
      join: ''
    - type: choice
      alternatives:
      - type: literal
        text: ;
      - type: line_end
  projection:
    ast_kind: function
    role: Declaration
    name_capture: name
    regions:
    - capture: annotation
      trim_start: 0
      trim_end: 0
    - capture: signature
      trim_start: 0
      trim_end: 0
      context: signature
    - capture: body
      trim_start: 0
      trim_end: 0
      context: expression
    scope:
      visibility: whole_scope
      parent_lookup: true
      shadowing: nearest
