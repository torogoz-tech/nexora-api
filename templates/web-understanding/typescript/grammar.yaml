schema_version: 9
max_nesting: 128
max_steps: 1000000
file_scope:
  visibility: whole_scope
  parent_lookup: false
  shadowing: nearest
root_productions:
- static_module_import
- function
- arrow_typed_block
- arrow_typed_expression
- arrow_block
- arrow_expression
- class_header
- class
- interface_header
- interface
- enum_header
- enum
- type_alias
- variable_typed
- variable
- uninitialized_variable
- directive
- destructured_variable
- export_list
- expression_statement
contexts:
  body:
    productions:
    - function
    - local_arrow_typed_block
    - local_arrow_typed_expression
    - local_arrow_block
    - local_arrow_expression
    - local_variable_typed
    - local_variable
    - local_uninitialized_variable
    - body_block
    - return_empty
    - return_value
    - expression_statement
    ignored:
    - type: literal
      text: ;
  expression:
    expression:
      ast_kind: expression
      identifiers:
      - identifier
      literals:
      - number
      - string
      - template
      - regexp_literal
      literal_selectors:
      - text: 'true'
        kind: keyword
      - text: 'false'
        kind: keyword
      - text: 'null'
        kind: keyword
      - text: this
        kind: keyword
      - text: super
        kind: keyword
      grouping:
      - open: (
        close: )
        kind: delimiter
      prefix:
      - token:
          text: +
        precedence: 160
      - token:
          text: '-'
        precedence: 160
      - token:
          text: '!'
        precedence: 160
      - token:
          text: '~'
        precedence: 160
      - token:
          text: typeof
        precedence: 160
      - token:
          text: void
        precedence: 160
      - token:
          text: delete
        precedence: 160
      - token:
          text: await
        precedence: 160
      infix:
      - token:
          text: '*'
        precedence: 140
        associativity: left
        kind: infix
      - token:
          text: /
        precedence: 140
        associativity: left
        kind: infix
      - token:
          text: '%'
        precedence: 140
        associativity: left
        kind: infix
      - token:
          text: +
        precedence: 130
        associativity: left
        kind: infix
      - token:
          text: '-'
        precedence: 130
        associativity: left
        kind: infix
      - token:
          text: '<<'
        precedence: 120
        associativity: left
        kind: infix
      - token:
          text: '>>'
        precedence: 120
        associativity: left
        kind: infix
      - token:
          text: '>>>'
        precedence: 120
        associativity: left
        kind: infix
      - token:
          text: <
        precedence: 110
        associativity: left
        kind: infix
      - token:
          text: '>'
        precedence: 110
        associativity: left
        kind: infix
      - token:
          text: <=
        precedence: 110
        associativity: left
        kind: infix
      - token:
          text: '>='
        precedence: 110
        associativity: left
        kind: infix
      - token:
          text: in
        precedence: 110
        associativity: left
        kind: infix
      - token:
          text: instanceof
        precedence: 110
        associativity: left
        kind: infix
      - token:
          text: ==
        precedence: 100
        associativity: left
        kind: infix
      - token:
          text: '!='
        precedence: 100
        associativity: left
        kind: infix
      - token:
          text: ===
        precedence: 100
        associativity: left
        kind: infix
      - token:
          text: '!=='
        precedence: 100
        associativity: left
        kind: infix
      - token:
          text: '&'
        precedence: 90
        associativity: left
        kind: infix
      - token:
          text: ^
        precedence: 80
        associativity: left
        kind: infix
      - token:
          text: '|'
        precedence: 70
        associativity: left
        kind: infix
      - token:
          text: '&&'
        precedence: 60
        associativity: left
        kind: infix
      - token:
          text: '||'
        precedence: 50
        associativity: left
        kind: infix
      - token:
          text: '='
        precedence: 10
        associativity: right
        kind: assignment
      - token:
          text: +=
        precedence: 10
        associativity: right
        kind: assignment
      - token:
          text: -=
        precedence: 10
        associativity: right
        kind: assignment
      - token:
          text: '*='
        precedence: 10
        associativity: right
        kind: assignment
      - token:
          text: /=
        precedence: 10
        associativity: right
        kind: assignment
      - token:
          text: '%='
        precedence: 10
        associativity: right
        kind: assignment
      postfix:
      - token:
          text: ++
        precedence: 170
      - token:
          text: --
        precedence: 170
      member:
      - token:
          text: .
        precedence: 190
      - token:
          text: ?.
        precedence: 190
      application:
      - open: (
        close: )
        kind: delimiter
        separator:
          text: ','
          kind: delimiter
        precedence: 180
      - open: '['
        close: ']'
        kind: delimiter
        separator:
          text: ','
          kind: delimiter
        precedence: 180
        expression_kind: index
        max_arguments: 1
      conditional:
      - token:
          text: '?'
          kind: operator
        separator:
          text: ':'
          kind: operator
        precedence: 20
        consequent_precedence: 10
        alternative_precedence: 10
      assignment_targets:
      - identifier
      - member
      - index
  signature:
    stop_on_error: true
    productions:
    - single_arrow_signature
    - arrow_signature_typed
    - arrow_signature
    - function_signature_typed
    - function_signature
    ignored: []
  parameters:
    stop_on_error: true
    productions:
    - typed_parameter
    - parameter
    ignored:
    - type: literal
      text: )
      kind: delimiter
groups:
- open: (
  close: )
  kind: delimiter
- open: '['
  close: ']'
  kind: delimiter
- open: '{'
  close: '}'
  kind: delimiter
ignored:
- type: literal
  text: ;
opaque_references:
- text: import
  kind: keyword
recovery:
- text: ;
  kind: delimiter
recover_line_break: true
recovery_groups:
- '{'
rules:
  named_binding:
    type: sequence
    items:
    - type: optional
      item:
        type: literal
        text: type
    - type: sequence
      items:
      - type: token
        kind: identifier
      - type: optional
        item:
          type: sequence
          items:
          - type: literal
            text: as
          - type: token
            kind: identifier
  named:
    type: sequence
    items:
    - type: literal
      text: '{'
    - type: optional
      item:
        type: sequence
        items:
        - type: rule
          name: named_binding
        - type: repeat
          item:
            type: sequence
            items:
            - type: literal
              text: ','
            - type: rule
              name: named_binding
          min: 0
          max: 128
        - type: optional
          item:
            type: literal
            text: ','
    - type: literal
      text: '}'
  namespace:
    type: sequence
    items:
    - type: literal
      text: '*'
    - type: literal
      text: as
    - type: token
      kind: identifier
  bindings:
    type: choice
    alternatives:
    - type: sequence
      items:
      - type: token
        kind: identifier
      - type: optional
        item:
          type: sequence
          items:
          - type: literal
            text: ','
          - type: choice
            alternatives:
            - type: rule
              name: namespace
            - type: rule
              name: named
    - type: rule
      name: namespace
    - type: rule
      name: named
  module_source:
    type: choice
    alternatives:
    - type: capture
      name: source
      item:
        type: token
        kind: string
      join: ''
    - type: sequence
      items:
      - type: rule
        name: bindings
      - type: literal
        text: from
      - type: capture
        name: source
        item:
          type: token
          kind: string
        join: ''
  prefix:
    type: sequence
    items:
    - type: optional
      item:
        type: literal
        text: export
    - type: optional
      item:
        type: literal
        text: default
    - type: optional
      item:
        type: literal
        text: declare
    - type: optional
      item:
        type: literal
        text: abstract
    - type: optional
      item:
        type: sequence
        items:
        - type: literal
          text: async
        - type: gap_without
          characters: "\n\r\L\P"
  type_atom:
    type: sequence
    items:
    - type: choice
      alternatives:
      - type: token
        kind: identifier
      - type: literal
        text: void
        kind: keyword
      - type: literal
        text: 'null'
        kind: keyword
      - type: literal
        text: 'true'
        kind: keyword
      - type: literal
        text: 'false'
        kind: keyword
    - type: repeat
      item:
        type: sequence
        items:
        - type: literal
          text: .
        - type: token
          kind: identifier
      min: 0
      max: 32
    - type: repeat
      item:
        type: sequence
        items:
        - type: literal
          text: '['
        - type: literal
          text: ']'
      min: 0
      max: 16
productions:
- name: static_module_import
  pattern:
    type: sequence
    items:
    - type: literal
      text: import
      kind: keyword
    - type: optional
      item:
        type: literal
        text: type
    - type: rule
      name: module_source
    - type: choice
      alternatives:
      - type: literal
        text: ;
      - type: line_end
  projection:
    ast_kind: module_import
    role: Reference
    name_capture: source
- name: function
  pattern:
    type: sequence
    items:
    - type: rule
      name: prefix
    - type: literal
      text: function
    - type: optional
      item:
        type: literal
        text: '*'
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: signature
      item:
        type: sequence
        items:
        - type: sequence
          items:
          - type: optional
            item:
              type: sequence
              items:
              - type: literal
                text: <
              - type: scan_until
                stop:
                - text: '>'
              - type: literal
                text: '>'
          - type: balanced
            open: (
        - type: optional
          item:
            type: sequence
            items:
            - type: literal
              text: ':'
            - type: scan_until
              stop:
              - text: '{'
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
        open: '{'
      join: ''
  projection:
    ast_kind: function
    role: Declaration
    name_capture: name
    regions:
    - capture: signature
      trim_start: 0
      trim_end: 0
      context: signature
    - capture: body
      trim_start: 1
      trim_end: 1
      context: body
    scope:
      visibility: whole_scope
      parent_lookup: true
      shadowing: nearest
- name: arrow_typed_block
  pattern:
    type: sequence
    items:
    - type: rule
      name: prefix
    - type: choice
      alternatives:
      - type: literal
        text: const
      - type: literal
        text: let
      - type: literal
        text: var
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: annotation
      item:
        type: sequence
        items:
        - type: literal
          text: ':'
        - type: scan_until
          stop:
          - text: '='
      join: ''
    - type: literal
      text: '='
    - type: capture
      name: signature
      item:
        type: sequence
        items:
        - type: optional
          item:
            type: sequence
            items:
            - type: literal
              text: async
            - type: gap_without
              characters: "\n\r\L\P"
        - type: choice
          alternatives:
          - type: sequence
            items:
            - type: optional
              item:
                type: sequence
                items:
                - type: literal
                  text: <
                - type: scan_until
                  stop:
                  - text: '>'
                - type: literal
                  text: '>'
            - type: balanced
              open: (
          - type: token
            kind: identifier
        - type: optional
          item:
            type: sequence
            items:
            - type: literal
              text: ':'
            - type: scan_until
              stop:
              - text: =>
        - type: gap_without
          characters: "\n\r\L\P"
        - type: literal
          text: =>
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
        open: '{'
      join: ''
    - type: optional
      item:
        type: literal
        text: ;
  projection:
    ast_kind: function
    role: Declaration
    name_capture: name
    regions:
    - capture: annotation
      trim_start: 0
      trim_end: 0
    - capture: signature
      trim_start: 0
      trim_end: 0
      context: signature
    - capture: body
      trim_start: 1
      trim_end: 1
      context: body
    scope:
      visibility: whole_scope
      parent_lookup: true
      shadowing: nearest
- name: arrow_typed_expression
  pattern:
    type: sequence
    items:
    - type: rule
      name: prefix
    - type: choice
      alternatives:
      - type: literal
        text: const
