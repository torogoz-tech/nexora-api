      scope:
        visibility: whole_scope
        parent_lookup: false
        shadowing: nearest
      lexical_context: razor
  header_routes:
    control:
      language: csharp_views
      context: control_header_opaque
      scope:
        visibility: whole_scope
        parent_lookup: false
        shadowing: nearest
      lexical_context: razor
    conditional:
      language: csharp_views
      context: control_header_opaque
      scope:
        visibility: whole_scope
        parent_lookup: false
        shadowing: nearest
      lexical_context: razor
