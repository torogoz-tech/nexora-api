  roles:
    regular_string: guard
    verbatim_string: literal
    character: guard
    raw_string: literal
    interpolated_regular: carrier
    interpolated_verbatim: carrier
    block_comment: literal
    line_comment: literal
    interpolation: guard
    code_group: guard
    paren_group: guard
    bracket_group: guard
    conditional_tail: guard
    c_regular_string: guard
