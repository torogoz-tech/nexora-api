    c_character: guard
    c_raw_string: literal
    c_interpolated_regular: carrier
    c_interpolated_verbatim: carrier
    c_block_comment: literal
    c_line_comment: literal
    c_interpolation: guard
    c_code_group: guard
    c_paren_group: guard
    c_bracket_group: guard
    c_conditional_tail: guard
    members: grammar
    code_block: grammar
    explicit_expression: grammar
    razor_comment: literal
    unknown_tail: guard
    attribute_double: guard
    attribute_single: guard
    markup_tag: guard
    html_comment: carrier
    script: carrier
    style: carrier
    escaped_header_at: literal
    implicit_expression: grammar
    email_fragment: literal
    directive_attribute: guard
    control: guard
    body_group: guard
    csharp_statement: guard
    case_label: guard
    body_void: guard
    body_element: carrier
    body_line: carrier
    conditional: guard
    branch_line_comment: guard
    branch_block_comment: guard
    escaped_body_at: literal
    line_carrier_comment: guard
    line_carrier_block_comment: guard
    interpolated_raw: carrier
    raw_interpolation: guard
    c_interpolated_raw: carrier
    c_raw_interpolation: guard
  header_roles:
