    script: carrier
    style: carrier
    c_interpolation: guard
    body_element: guard
    control: grammar
    conditional: grammar
    raw_interpolation: guard
    c_raw_interpolation: guard
  routes:
    members:
      language: csharp_views
      context: members_opaque
      scope:
        visibility: whole_scope
        parent_lookup: false
        shadowing: nearest
      lexical_context: razor
