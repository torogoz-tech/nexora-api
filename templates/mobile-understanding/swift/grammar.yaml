schema_version: 4
max_nesting: 128
max_steps: 1000000
file_scope:
  visibility: whole_scope
  parent_lookup: false
  shadowing: nearest
root_productions: &id001
- classSimple
- structSimple
- enumSimple
- protocolSimple
- actorSimple
- extensionSimple
- functionSimple
- module_import
- class
- struct
- enum
- protocol
- actor
- extension
- function
- opaque_block
- opaque_parameters
- opaque_collection
- unmodeled_token
contexts:
  members:
    productions: *id001
    ignored: []
groups:
- open: (
  close: )
  kind: delimiter
- open: '{'
  close: '}'
  kind: delimiter
- open: '['
  close: ']'
  kind: delimiter
- open: <
  close: '>'
  kind: operator
rules: {}
ignored: []
recovery:
- text: ;
recover_line_break: true
productions:
- name: classSimple
  pattern:
    type: sequence
    items:
    - type: literal
      text: class
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
        open: '{'
      join: ''
  projection:
    ast_kind: class
    role: Declaration
    name_capture: name
    regions:
    - capture: body
      context: members
      trim_start: 1
      trim_end: 1
