schema_version: 4
max_nesting: 128
max_steps: 1000000
file_scope:
  visibility: whole_scope
  parent_lookup: false
  shadowing: nearest
root_productions: &id001
- classSimple
- interfaceSimple
- objectSimple
- functionSimple
- module_import
- class
- interface
- object
- function
- opaque_block
- opaque_parameters
- opaque_collection
- unmodeled_token
contexts:
  members:
    productions: *id001
    ignored: []
groups:
- open: (
  close: )
  kind: delimiter
- open: '{'
  close: '}'
  kind: delimiter
- open: '['
  close: ']'
  kind: delimiter
- open: <
  close: '>'
  kind: operator
rules: {}
ignored: []
recovery:
- text: ;
recover_line_break: true
productions:
- name: classSimple
  pattern:
    type: sequence
    items:
    - type: literal
      text: class
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
        open: '{'
      join: ''
  projection:
    ast_kind: class
    role: Declaration
    name_capture: name
    regions:
    - capture: body
      context: members
      trim_start: 1
      trim_end: 1
- name: interfaceSimple
  pattern:
    type: sequence
    items:
    - type: literal
      text: interface
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
        open: '{'
      join: ''
  projection:
    ast_kind: interface
    role: Declaration
    name_capture: name
    regions:
    - capture: body
      context: members
      trim_start: 1
      trim_end: 1
- name: objectSimple
  pattern:
    type: sequence
    items:
    - type: literal
      text: object
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
        open: '{'
      join: ''
  projection:
    ast_kind: object
    role: Declaration
    name_capture: name
    regions:
    - capture: body
      context: members
      trim_start: 1
      trim_end: 1
- name: functionSimple
  pattern:
    type: sequence
    items:
    - type: literal
      text: fun
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: region2
      item:
        type: balanced
        open: (
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
        open: '{'
      join: ''
  projection:
    ast_kind: function
    role: Declaration
    name_capture: name
    regions:
    - capture: region2
    - capture: body
- name: module_import
  pattern:
    type: sequence
    items:
    - type: literal
      text: import
    - type: capture
      name: name
      join: ''
      item:
        type: sequence
        items:
        - type: token
          kind: identifier
        - type: repeat
          min: 0
          max: 64
          item:
            type: sequence
            items:
            - type: literal
              text: .
            - type: token
              kind: identifier
  projection:
    ast_kind: module_import
    role: Declaration
    name_capture: name
    regions: []
- name: class
  pattern:
    type: sequence
    items:
    - type: literal
      text: class
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: region1
      item:
        type: scan_until
        stop:
        - text: '{'
        - text: ;
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
        open: '{'
      join: ''
  projection:
    ast_kind: class
    role: Declaration
    name_capture: name
    regions:
    - capture: region1
    - capture: body
      context: members
      trim_start: 1
      trim_end: 1
- name: interface
  pattern:
    type: sequence
    items:
    - type: literal
      text: interface
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: region1
      item:
        type: scan_until
        stop:
        - text: '{'
        - text: ;
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
        open: '{'
      join: ''
  projection:
    ast_kind: interface
    role: Declaration
    name_capture: name
    regions:
    - capture: region1
    - capture: body
      context: members
      trim_start: 1
      trim_end: 1
- name: object
  pattern:
    type: sequence
    items:
    - type: literal
      text: object
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: region1
      item:
        type: scan_until
        stop:
        - text: '{'
        - text: ;
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
        open: '{'
      join: ''
  projection:
    ast_kind: object
    role: Declaration
    name_capture: name
    regions:
    - capture: region1
    - capture: body
      context: members
      trim_start: 1
      trim_end: 1
- name: function
  pattern:
    type: sequence
    items:
    - type: literal
      text: fun
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: region2
      item:
        type: balanced
        open: (
      join: ''
    - type: capture
      name: region3
      item:
        type: scan_until
        stop:
        - text: '{'
        - text: ;
        - text: '='
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
        open: '{'
      join: ''
  projection:
    ast_kind: function
    role: Declaration
    name_capture: name
    regions:
    - capture: region2
    - capture: region3
    - capture: body
- name: opaque_block
  pattern:
    type: capture
    name: name
    item:
      type: balanced
      open: '{'
    join: ''
  projection:
    ast_kind: opaque_block
    role: Declaration
    name_capture: name
    regions:
    - capture: name
- name: opaque_parameters
  pattern:
    type: capture
    name: name
    item:
      type: balanced
      open: (
    join: ''
  projection:
    ast_kind: opaque_parameters
    role: Declaration
    name_capture: name
    regions:
    - capture: name
- name: opaque_collection
  pattern:
    type: capture
    name: name
    item:
      type: balanced
      open: '['
    join: ''
  projection:
    ast_kind: opaque_collection
    role: Declaration
    name_capture: name
    regions:
    - capture: name
- name: unmodeled_token
  pattern:
    type: capture
    name: name
    item:
      type: choice
      alternatives:
      - type: token
        kind: identifier
      - type: token
        kind: number
      - type: token
        kind: string
      - type: token
        kind: operator
      - type: token
        kind: delimiter
      - type: literal
        text: class
      - type: literal
        text: interface
      - type: literal
        text: object
      - type: literal
        text: import
      - type: literal
        text: package
      - type: literal
        text: fun
      - type: literal
        text: return
      - type: literal
        text: throw
      - type: literal
        text: if
      - type: literal
        text: for
      - type: literal
        text: while
      - type: literal
        text: switch
      - type: literal
        text: catch
      - type: literal
        text: when
      - type: literal
        text: new
      - type: literal
        text: else
    join: ''
  projection:
    ast_kind: unmodeled_token
    role: Container
    name_capture: name
    regions: []
