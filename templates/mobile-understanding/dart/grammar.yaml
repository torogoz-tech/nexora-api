schema_version: 4
max_nesting: 128
max_steps: 1000000
file_scope:
  visibility: whole_scope
  parent_lookup: false
  shadowing: nearest
root_productions: &id001
- arrow_function
- classSimple
- mixinSimple
- enumSimple
- extensionSimple
- functionSimple
- module_import
- class
- mixin
- enum
- extension
- function
- constructor
- opaque_block
- opaque_parameters
- opaque_collection
- unmodeled_token
contexts:
  members:
    productions: *id001
    ignored: []
groups:
- open: (
  close: )
  kind: delimiter
- open: '{'
  close: '}'
  kind: delimiter
- open: '['
  close: ']'
  kind: delimiter
- open: <
  close: '>'
  kind: operator
rules: {}
ignored: []
recovery:
- text: ;
recover_line_break: true
productions:
- name: arrow_function
  pattern:
    type: sequence
    items:
    - type: capture
      name: return_type
      item:
        type: sequence
        items:
        - type: token
          kind: identifier
        - type: optional
          item:
            type: balanced
            open: <
        - type: optional
          item:
            type: literal
            text: '?'
        - type: repeat
          item:
            type: sequence
            items:
            - type: literal
              text: '['
            - type: literal
              text: ']'
          min: 0
          max: 8
      join: ''
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: region2
      item:
        type: balanced
        open: (
      join: ''
    - type: literal
      text: =>
    - type: capture
      name: expression
      item:
        type: scan_until
        stop:
        - text: ;
      join: ''
    - type: literal
      text: ;
  projection:
    ast_kind: function
    role: Declaration
    name_capture: name
    regions:
    - capture: return_type
    - capture: region2
    - capture: expression
- name: classSimple
  pattern:
    type: sequence
    items:
    - type: literal
      text: class
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
        open: '{'
      join: ''
  projection:
    ast_kind: class
    role: Declaration
    name_capture: name
    regions:
    - capture: body
      context: members
      trim_start: 1
      trim_end: 1
- name: mixinSimple
  pattern:
    type: sequence
    items:
    - type: literal
      text: mixin
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
        open: '{'
      join: ''
  projection:
    ast_kind: mixin
    role: Declaration
    name_capture: name
    regions:
    - capture: body
      context: members
      trim_start: 1
      trim_end: 1
- name: enumSimple
  pattern:
    type: sequence
    items:
    - type: literal
      text: enum
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
        open: '{'
      join: ''
  projection:
    ast_kind: enum
    role: Declaration
    name_capture: name
    regions:
    - capture: body
      context: members
      trim_start: 1
      trim_end: 1
- name: extensionSimple
  pattern:
    type: sequence
    items:
    - type: literal
      text: extension
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
