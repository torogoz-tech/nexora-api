            - type: literal
              text: '['
            - type: literal
              text: ']'
          min: 0
          max: 8
      join: ''
    - type: capture
      name: name
      item:
        type: token
        kind: identifier
      join: ''
    - type: capture
      name: region2
      item:
        type: balanced
        open: (
      join: ''
    - type: capture
      name: body
      item:
        type: balanced
        open: '{'
      join: ''
  projection:
    ast_kind: function
    role: Declaration
    name_capture: name
    regions:
    - capture: body
    - capture: return_type
    - capture: region2
- name: module_import
  pattern:
    type: sequence
    items:
    - type: literal
      text: import
    - type: capture
      name: name
      item:
        type: token
        kind: string
      join: ''
    - type: literal
      text: ;
  projection:
    ast_kind: module_import
    role: Declaration
    name_capture: name
    regions: []
- name: class
