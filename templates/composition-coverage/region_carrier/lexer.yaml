schema_version: 4
identifier_kind: identifier
keywords:
- FUNC
- VAR
- BLOCK
- READ
- EVAL
tokens:
- kind: template
  pattern: ~\[
  region: template
- kind: whitespace
  pattern: \s+
  trivia: true
- kind: comment
  pattern: //[^\r\n]*
  trivia: true
- kind: identifier
  pattern: '[\p{L}_][\p{L}\p{N}_]*'
- kind: number
  pattern: '[0-9]+(?:\.[0-9]+)?'
- kind: string
  pattern: '"(?:[^"\\\r\n]|\\[^\r\n])*"'
- kind: operator
  pattern: \+\+|==|[+*^=.!-]
- kind: delimiter
  pattern: '[(){}\[\],;]'
regions:
  template:
    close: ']~'
    children:
    - pattern: '@\('
      region: code
  code:
    close: )
    children:
    - pattern: \(
      region: paren
    - pattern: ~\[
      region: template
    - pattern: '"'
      region: quote
  paren:
    close: )
    children:
    - pattern: \(
      region: paren
    - pattern: ~\[
      region: template
    - pattern: '"'
      region: quote
  quote:
    close: '"'
    escape: \
